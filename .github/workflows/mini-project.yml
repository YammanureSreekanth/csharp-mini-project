name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: >
          dotnet test csharp-mini-project/Ecom.WebApiApp.Tests/Ecom.WebApiApp.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "html;LogFileName=test-results.html"
          --results-directory ./TestResults

      # Publishes results as a GitHub Check with a pass/fail breakdown,
      # visible directly on the commit/PR — no download needed.
      - name: Publish test results to GitHub
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit test results
          path: TestResults/test-results.trx
          reporter: dotnet-trx

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-html
          path: TestResults/test-results.html
