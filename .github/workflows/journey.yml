name: .NET journey

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write  -> commit the regenerated README block
# pages / id-token -> publish the dashboard to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: journey-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # JourneyGen reads `git log`, so it needs the whole history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the solution
        run: dotnet build csharp-ecom-mini-app.slnx --configuration Release

      - name: Is the README block stale?
        id: stale
        run: |
          if dotnet run --project tools/JourneyGen --configuration Release -- --root . --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the journey page
        run: dotnet run --project tools/JourneyGen --configuration Release -- --root .

      - name: Commit the refreshed README
        if: steps.stale.outputs.stale == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.MD
          # [skip ci] keeps this commit from triggering the workflow again.
          git diff --cached --quiet || git commit -m "docs: refresh .NET journey page [skip ci]"
          git push

      # Requires a one-time repo setting: Settings -> Pages -> Source = "GitHub Actions".
      # Without it this step fails with "Get Pages site failed".
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/site
          # Dotfiles are excluded by default, which would drop .nojekyll.
          include-hidden-files: true

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
